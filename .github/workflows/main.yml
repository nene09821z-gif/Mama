name: ViLa Chess Native — build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find latest zip and prepare build directory
        id: source
        run: |
          set -euo pipefail

          LATEST=$(find . -name "vila-chess-*.zip" -not -path "./.git/*" \
            | sort -V -r | head -1 || true)

          if [ -n "$LATEST" ]; then
            echo "📦 Found zip: $LATEST"
            BUILD_DIR=$(mktemp -d /tmp/chess_src_XXXXXX)
            unzip -q "$LATEST" -d "$BUILD_DIR"

            GRADLE_ROOT=$(find "$BUILD_DIR" -maxdepth 2 -name "build.gradle.kts" \
              -not -path "*/app/*" | sort | head -1)

            if [ -n "$GRADLE_ROOT" ]; then
              GRADLE_ROOT=$(dirname "$GRADLE_ROOT")
            else
              echo "❌ build.gradle.kts not found inside zip"
              exit 1
            fi

            echo "build_dir=$GRADLE_ROOT"            >> "$GITHUB_OUTPUT"
            echo "zip_name=$(basename "$LATEST")"    >> "$GITHUB_OUTPUT"
            echo "✅ Build dir: $GRADLE_ROOT"
          else
            echo "📂 No zip found — building from repo root"
            echo "build_dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
            echo "zip_name=repo-root"          >> "$GITHUB_OUTPUT"
          fi

      - name: Use fixed keystore (Secret hoặc file trong repo) — giữ nguyên SHA-1 cũ
        env:
          KS_B64: ${{ secrets.VILA_KEYSTORE_B64 }}
        run: |
          BD="${{ steps.source.outputs.build_dir }}"
          mkdir -p "$BD/app"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$BD/app/vila.keystore"
            echo "✅ Dùng keystore từ GitHub Secret VILA_KEYSTORE_B64"; exit 0
          fi
          for K in "$GITHUB_WORKSPACE/vila.keystore" "$GITHUB_WORKSPACE/app/vila.keystore"; do
            if [ -f "$K" ]; then cp "$K" "$BD/app/vila.keystore"; echo "✅ Dùng keystore trong repo: $K"; exit 0; fi
          done
          echo "ℹ️ Không có keystore ngoài zip — dùng keystore nằm trong zip (nếu có)"

      - name: Inject Google client IDs từ GitHub Secrets (nếu có)
        env:
          ANDROID_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          WEB_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          F="${{ steps.source.outputs.build_dir }}/app/src/main/res/values/strings.xml"
          if [ -n "$ANDROID_ID" ]; then
            sed -i "s|\(<string name=\"google_android_client_id\">\)[^<]*|\1$ANDROID_ID|" "$F"
            echo "✅ Đã điền google_android_client_id"
          else
            echo "ℹ️ Chưa có Secret GOOGLE_ANDROID_CLIENT_ID"
          fi
          if [ -n "$WEB_ID" ]; then
            sed -i "s|\(<string name=\"google_web_client_id\">\)[^<]*|\1$WEB_ID|" "$F"
            echo "✅ Đã điền google_web_client_id"
          else
            echo "ℹ️ Chưa có Secret GOOGLE_WEB_CLIENT_ID (dùng giá trị trong zip)"
          fi
          grep -E "google_(android|web)_client_id" "$F" | sed 's/[0-9]\{6,\}-[a-z0-9]*/ID_ĐÃ_ẨN/'

      - name: Download native Stockfish from official release (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="${{ steps.source.outputs.build_dir }}/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$D"
          T=$(mktemp -d)
          U=""
          # Thử bản ổn định mới nhất trước, rồi tới danh sách mọi bản phát hành (kể cả dev).
          for API in "releases/latest" "releases?per_page=30"; do
            URLS=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/official-stockfish/Stockfish/$API" \
              | jq -r '(if type=="array" then .[] else . end) | .assets[]?
                       | select(.name|test("android";"i"))
                       | select(.name|test("\\.(tar|tar\\.gz|tgz|zip)$";"i"))
                       | .browser_download_url' || true)
            # Ưu tiên bản universal (tự chọn tập lệnh), sau đó arm64/armv8 không dotprod.
            U=$(echo "$URLS" | grep -i universal | head -1 || true)
            [ -z "$U" ] && U=$(echo "$URLS" | grep -iv dotprod | grep -iE 'arm64|armv8' | head -1 || true)
            [ -n "$U" ] && break
          done
          BIN=""
          if [ -n "$U" ]; then
            echo "⬇️ Tải: $U"
            if curl -fL --retry 3 -o "$T/asset" "$U"; then
              if tar -tf "$T/asset" >/dev/null 2>&1; then
                tar -xf "$T/asset" -C "$T"
              else
                unzip -q "$T/asset" -d "$T" || true
              fi
              BIN=$(find "$T" -type f -size +2M ! -path "$T/asset" | head -1)
            fi
          fi
          if [ -n "$BIN" ] && [ "$(head -c4 "$BIN" | tail -c3)" = "ELF" ]; then
            cp "$BIN" "$D/libstockfish.so"
            echo "✅ Native engine: $(basename "$BIN") — $(du -h "$D/libstockfish.so" | cut -f1)"
          else
            echo "⚠️ Không lấy được engine native hợp lệ — app dùng bản wasm lite dự phòng"
          fi

      - name: Download full opening book (Lichess chess-openings, CC0) — nhãn Book + tên khai cuộc trên bàn cờ phân tích
        continue-on-error: true
        run: |
          set -uo pipefail
          BD="${{ steps.source.outputs.build_dir }}"
          OUT="$BD/app/src/main/assets/openings.tsv"
          mkdir -p "$(dirname "$OUT")"
          TMP=$(mktemp -d)
          BASE="https://raw.githubusercontent.com/lichess-org/chess-openings/master"
          printf 'eco\tname\tpgn\n' > "$TMP/all.tsv"
          FAILED=0
          # a.tsv … e.tsv = 5 phần ECO. Mỗi file: dòng đầu là tiêu đề (bỏ), giữ 3 cột đầu: eco, name, pgn.
          for L in a b c d e; do
            if curl -fsSL --retry 4 --retry-delay 3 "$BASE/$L.tsv" -o "$TMP/$L.tsv"; then
              tail -n +2 "$TMP/$L.tsv" | tr -d '\r' | cut -f1-3 >> "$TMP/all.tsv"
            else
              echo "⚠️ Không tải được $L.tsv"; FAILED=1
            fi
          done
          N=$(( $(wc -l < "$TMP/all.tsv") - 1 ))
          # Bộ đầy đủ ~3.600 dòng. Dưới 3.000 (thiếu file/tải lỗi) thì KHÔNG ghi đè: app dùng bản sẵn có hoặc bộ rút gọn trong code.
          if [ "$FAILED" -eq 0 ] && [ "$N" -ge 3000 ]; then
            cp "$TMP/all.tsv" "$OUT"
            echo "✅ Opening book: $N khai cuộc — $(du -h "$OUT" | cut -f1)"
            echo "📖 Opening book: **$N** khai cuộc (Lichess chess-openings)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Opening book chưa đủ ($N dòng, lỗi tải=$FAILED) — app dùng bộ khai cuộc rút gọn dự phòng"
          fi

      - name: Generate puzzles.db from Lichess (50.000 câu dễ nhất) — nếu chưa có
        continue-on-error: true
        run: |
          BD="${{ steps.source.outputs.build_dir }}"
          if [ -s "$BD/app/src/main/assets/puzzles.db" ]; then echo "✅ puzzles.db có sẵn"; exit 0; fi
          python3 "$BD/scripts/generate_puzzles.py" --out "$BD/app/src/main/assets/puzzles.db"             || echo "⚠️ Không tạo được puzzles.db — app dùng bộ câu đố dự phòng"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: ${{ steps.source.outputs.build_dir }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Show failed tests in run summary
        if: always() && steps.tests.outcome == 'failure'
        run: |
          {
            echo "### ❌ Unit tests failed"
            echo "Source: **${{ steps.source.outputs.zip_name }}**"
            echo '```'
            find "${{ steps.source.outputs.build_dir }}/app/build/test-results" \
              -name "*.xml" 2>/dev/null \
              | xargs grep -rhE '<testcase|<failure' 2>/dev/null \
              | grep -B1 '<failure' | cut -c1-400 | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.build_dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK is non-empty
        run: |
          APK="${{ steps.source.outputs.build_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          if [ -s "$APK" ]; then
            echo "✅ APK OK — $(du -sh "$APK" | cut -f1)"
          else
            echo "❌ APK missing or empty"
            exit 1
          fi

      - name: Show APK signing fingerprints (SHA-1 / Facebook key hash)
        if: always()
        run: |
          APK="${{ steps.source.outputs.build_dir }}/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then echo "APK chưa có"; exit 0; fi
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA1=$("$AS" verify --print-certs "$APK" | grep -i "SHA-1 digest" | head -1 | awk '{print $NF}')
          SHA1C=$(echo "$SHA1" | sed 's/../&:/g; s/:$//' | tr a-f A-F)
          FBHASH=$(echo "$SHA1" | xxd -r -p | base64)
          if [ -f "${{ steps.source.outputs.build_dir }}/app/vila.keystore" ]; then
            NOTE="✅ APK được ký bằng app/vila.keystore (cố định)"
          else
            NOTE="⚠️ Không thấy app/vila.keystore: APK ký bằng khoá debug ngẫu nhiên, SHA-1 sẽ đổi mỗi lần build"
          fi
          {
            echo "## 🔑 Chữ ký APK"
            echo "$NOTE"
            echo ""
            echo "**SHA-1 (dán vào Google Cloud, client Android):**"
            echo '```'
            echo "$SHA1C"
            echo '```'
            echo "**Key hash (dán vào Facebook Developers):**"
            echo '```'
            echo "$FBHASH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$NOTE"; echo "SHA-1: $SHA1C"; echo "FB key hash: $FBHASH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vila-chess-${{ steps.source.outputs.zip_name }}-debug
          path: ${{ steps.source.outputs.build_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ steps.source.outputs.zip_name }}
          path: ${{ steps.source.outputs.build_dir }}/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          {
            echo "## 🏗️ Build Summary"
            echo "| | |"
            echo "|---|---|"
            echo "| **Source zip** | \`${{ steps.source.outputs.zip_name }}\` |"
            echo "| **Tests**      | ${{ steps.tests.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "❌ Unit tests failed — xem run summary."
          exit 1
          
